name: Temporary - fetch Tangle Ridge maps
on:
  push:
    branches: [claude/tangle-ridge]
    paths: [.github/workflows/tmp-fetch-tangle.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch maps
        run: |
          set -o pipefail
          { TANGLE="$(node scripts/tmp-find-tangle.mjs)" && export TANGLE && echo "CONFIG $TANGLE" && node scripts/fetch-course.mjs tangle; } 2>&1 | tee tmp-fetch.log
      - name: Save results to this branch
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tmp-fetch.log
          if [ -d public/data/tangle ]; then git add public/data/tangle; fi
          git commit -m "Tangle Ridge map download results"
          git push
