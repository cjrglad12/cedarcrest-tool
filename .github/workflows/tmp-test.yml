name: Temporary - test Tangle Ridge
on:
  push:
    branches: [claude/tangle-ridge]
    paths: [.github/workflows/tmp-test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          set -o pipefail
          { npm test && npm run build; } 2>&1 | tee tmp-test.log
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tmp-test.log && git commit -m "Test results" && git push
